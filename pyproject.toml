[project]
name = "agnara-landing-reference"
version = "0.1.0"
description = "Reference implementation of a web application using Agnara as the core engine."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agnara>=0.1.0",
    "agnara-http>=0.1.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=23.1.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.5",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
